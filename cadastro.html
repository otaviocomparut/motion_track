<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Motion Track - Cadastro</title>

<link rel="stylesheet" href="estilo.css"/>

</head>

<body>

<div class="container">

<div class="logo">

<h1>Motion Track</h1>

<p>Cadastro</p>

</div>

<form id="cadastroForm">

<div class="input-group">

<label>Nome Completo</label>

<input
type="text"
id="nome"
required
>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
id="emailCadastro"
required
>

</div>

<div class="input-group">

<label>Senha</label>

<input
type="password"
id="senhaCadastro"
required
>

</div>

<div class="input-group">

<label>Tipo de Usuário</label>

<select id="tipoUsuario">

<option value="profissional">

Profissional de Saúde

</option>

<option value="paciente">

Paciente

</option>

</select>

</div>

<button type="submit">

Cadastrar

</button>

</form>

<div class="link">

<a href="login.html">

Voltar ao Login

</a>

</div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
