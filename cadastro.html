<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Motion Track - Cadastro</title>
</head>

<body>

    <h1>Motion Track</h1>

    <h2>Cadastro</h2>

    <form id="cadastroForm">

        <label>Nome</label>
        <br>
        <input
            type="text"
            id="nome"
            required
        >

        <br><br>

        <label>Email</label>
        <br>
        <input
            type="email"
            id="emailCadastro"
            required
        >

        <br><br>

        <label>Senha</label>
        <br>
        <input
            type="password"
            id="senhaCadastro"
            required
        >

        <br><br>

        <label>Tipo de Usuário</label>
        <br>

        <select id="tipoUsuario">

            <option value="profissional">
                Profissional
            </option>

            <option value="paciente">
                Paciente
            </option>

        </select>

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <br>

    <a href="login.html">
        Voltar para Login
    </a>

    <script src="auth.js"></script>

</body>

</html>
