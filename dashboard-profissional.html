<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard Profissional</title>
    <style>
        

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#050505;

    color:white;

    font-family:
    "Segoe UI",
    sans-serif;

}

.header{

    display:flex;

    align-items:center;

    gap:20px;

    padding:25px;

    background:#111;

    border-bottom:
    2px solid #00ff66;

}

.logo{

    width:70px;

}

.header h1{

    color:#00ff66;

}

.header h2{

    color:white;

    font-size:18px;

    font-weight:400;

}

.container{

    max-width:1200px;

    margin:auto;

    padding:30px;

}

.card{

    background:#181818;

    padding:25px;

    border-radius:16px;

    margin-bottom:25px;

    box-shadow:
    0 0 15px rgba(0,255,100,.1);

}

.card h3{

    color:#00ff66;

    margin-bottom:20px;

}

input,
select{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:none;

    border-radius:10px;

    background:#2c2c2c;

    color:white;

}

button{

    background:#00ff66;

    color:black;

    border:none;

    padding:12px 20px;

    border-radius:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#00dd55;

}

ul{

    list-style:none;

}

li{

    background:#222;

    padding:15px;

    margin-bottom:10px;

    border-radius:10px;

}

a{

    color:#00ff66;

}

</style>
    </style>
</head>

<body>

    <div class="header">

        <img
            src="imagens do site e logos/logo.svg.png"
            alt="Motion Track"
            class="logo">

        <div>

            <h1>Motion Track</h1>

            <h2>Painel do Profissional</h2>

        </div>

    </div>

    <div class="container">

        <div class="card">

            <h3>Cadastrar Paciente</h3>

            <form id="formPaciente">

                <input
                    type="text"
                    id="nomePaciente"
                    placeholder="Nome"
                    required>

                <input
                    type="email"
                    id="emailPaciente"
                    placeholder="Email"
                    required>

                <button type="submit">
                    Salvar Paciente
                </button>

            </form>

        </div>

        <div class="card">

            <h3>Pacientes</h3>

            <ul id="listaPacientes"></ul>

        </div>

        <div class="card">

            <h3>Criar Exercício</h3>

            <form id="formExercicio">

                <select id="pacienteSelecionado"></select>

                <select id="tipoExercicio">

                    <option value="romberg">
                        Teste de Romberg
                    </option>

                    <option value="unipodal">
                        Apoio Unipodal
                    </option>

                    <option value="marcha">
                        Marcha Estacionária
                    </option>

                    <option value="berg">
                        Escala Berg
                    </option>

                </select>

                <button type="submit">
                    Enviar Exercício
                </button>

            </form>

        </div>

        <div class="card">

            <h3>Vídeos Enviados</h3>

            <ul id="listaVideos"></ul>

        </div>

        <div class="card">

            <h3>Perfil Clínico do Paciente</h3>

            <select id="pacientePerfil"></select>

            <br><br>

            <div id="perfilPaciente"></div>

        </div>

    </div>

    <script
        type="module"
        src="pacientes.js">
    </script>

</body>

</html>
