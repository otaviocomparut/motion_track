<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Motion Track - Login</title>
</head>

<body>

    <h1>Motion Track</h1>

    <h2>Login</h2>

    <form id="loginForm">

        <label>Email</label>
        <br>
        <input
            type="email"
            id="email"
            required
        >

        <br><br>

        <label>Senha</label>
        <br>
        <input
            type="password"
            id="senha"
            required
        >

        <br><br>

        <button type="submit">
            Entrar
        </button>

    </form>

    <br>

    <a href="cadastro.html">
        Criar Conta
    </a>

    <script src="auth.js"></script>

</body>

</html>
