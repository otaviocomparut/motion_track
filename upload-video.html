<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Upload de Vídeo
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#080b09;

            color:white;

            font-family:
            "Segoe UI",
            sans-serif;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }

        .container{

            width:100%;

            max-width:600px;

            background:
            linear-gradient(
                145deg,
                #191f1b,
                #121713
            );

            border:
            1px solid rgba(
                0,
                237,
                112,
                .15
            );

            border-radius:20px;

            padding:40px;

            text-align:center;

            box-shadow:
            0 0 25px rgba(
                0,
                237,
                112,
                .08
            );

        }

        .logo{

            width:90px;

            background:white;

            border-radius:10px;

            padding:5px;

            margin-bottom:20px;

        }

        h1{

            color:#00ed70;

            margin-bottom:10px;

        }

        p{

            color:#a0aaa3;

            margin-bottom:30px;

        }

        .upload-area{

            background:#202722;

            border:
            2px dashed
            rgba(
                0,
                237,
                112,
                .25
            );

            border-radius:15px;

            padding:30px;

            margin-bottom:25px;

        }

        input[type=file]{

            width:100%;

            color:white;

        }

        button{

            background:#00ed70;

            color:#061009;

            border:none;

            padding:14px 30px;

            border-radius:10px;

            cursor:pointer;

            font-weight:700;

            transition:.3s;

        }

        button:hover{

            background:#00c85e;

            transform:
            translateY(-2px);

        }

        #resultado{

            margin-top:25px;

            color:white;

        }

        #resultado a{

            color:#00ed70;

            font-weight:bold;

            text-decoration:none;

        }

    </style>

</head>

<body>

    <div class="container">

        <img
            src="imagens do site e logos/logo.svg.png"
            alt="Motion Track"
            class="logo">

        <h1>
            Upload de Vídeo
        </h1>

        <p>

            Selecione o vídeo solicitado
            pelo profissional e envie para
            análise.

        </p>

        <div class="upload-area">

            <input
                type="file"
                id="videoFile"
                accept="video/*">

        </div>

        <button id="btnUpload">

            Enviar Vídeo

        </button>

        <div id="resultado"></div>

    </div>

    <script
        type="module"
        src="upload.js">
    </script>

</body>

</html>
